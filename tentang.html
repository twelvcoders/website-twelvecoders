<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tentang Kelas</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .container { padding: 120px 10% 50px; }
        .timeline {
            border-left: 4px solid var(--primary);
            padding-left: 30px;
            position: relative;
        }
        .timeline-item {
            position: relative;
            margin-bottom: 50px;
        }
        .timeline-item::before {
            content: '';
            position: absolute;
            left: -42px;
            top: 0;
            width: 20px;
            height: 20px;
            background: var(--secondary);
            border-radius: 50%;
            border: 4px solid white;
        }
        .stats {
            display: flex;
            justify-content: space-around;
            margin-top: 50px;
            text-align: center;
        }
        .counter { font-size: 3rem; font-weight: bold; color: var(--primary); }
    </style>
</head>
<body>
    <nav>
        <a href="index.html" style="text-decoration: none;"><div class="logo">BACK</div></a>
        <div class="theme-switch" id="theme-toggle"><i class="fas fa-moon"></i></div>
    </nav>

    <div class="container">
        <h1 class="reveal">Sejarah Kelas Kita</h1>
        <div class="timeline">
            <div class="timeline-item glass-card reveal" style="padding: 20px;">
                <h4>Juli 2021</h4>
                <p>Hari pertama kita bertemu di Masa Orientasi. Masih malu-malu!</p>
            </div>
            <div class="timeline-item glass-card reveal" style="padding: 20px;">
                <h4>Desember 2022</h4>
                <p>Juara 1 Lomba Kebersihan Kelas dan Paduan Suara.</p>
            </div>
            <div class="timeline-item glass-card reveal" style="padding: 20px;">
                <h4>Januari 2024</h4>
                <p>Memulai perjalanan akhir semester dengan semangat tinggi.</p>
            </div>
        </div>

        <div class="stats reveal">
            <div><div class="counter" data-target="32">0</div><p>Siswa</p></div>
            <div><div class="counter" data-target="15">0</div><p>Event</p></div>
            <div><div class="counter" data-target="8">0</div><p>Prestasi</p></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
