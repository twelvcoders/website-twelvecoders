<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Favorit Song</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .player-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            padding-top: 80px;
        }
        .vinyl {
            width: 250px;
            height: 250px;
            background: #222 url('https://upload.wikimedia.org/wikipedia/commons/b/b6/Vinyl_record_LP.png') center/cover;
            border-radius: 50%;
            margin-bottom: 30px;
            box-shadow: 0 0 50px rgba(0,0,0,0.5);
        }
        .vinyl.playing { animation: rotate 5s linear infinite; }
        @keyframes rotate { from {transform: rotate(0deg);} to {transform: rotate(360deg);} }
        
        #visualizer { width: 100%; height: 100px; margin-top: 20px; }
        .controls { display: flex; gap: 20px; align-items: center; margin-top: 20px; }
    </style>
</head>
<body>
    <nav>
        <a href="index.html" style="text-decoration: none;"><div class="logo">BACK</div></a>
        <div class="theme-switch" id="theme-toggle"><i class="fas fa-moon"></i></div>
    </nav>

    <div class="player-container">
        <div class="vinyl glass-card" id="vinyl"></div>
        <div class="glass-card" style="padding: 30px; text-align: center; width: 90%; max-width: 500px;">
            <h3>Yang Patah Tumbuh...</h3>
            <p>Banda Neira</p>
            <h3>Sampai Jadi Debu</h3>
            <p>Banda Neira (feat. Gardika Gigih)</p>
            
            <canvas id="visualizer"></canvas>
            
            <audio id="audio" src="https://mp3tourl.com/audio/1777300508407-9b196423-0e37-4908-bc3a-d221315ad050.mp3"></audio>
            
            <div class="controls">
                <i class="fas fa-step-backward fa-2x"></i>
                <button class="btn-neon" id="playBtn"><i class="fas fa-play"></i></button>
                <i class="fas fa-step-forward fa-2x"></i>
            </div>
            <input type="range" id="volume" min="0" max="1" step="0.1" style="width:100%; margin-top:20px">
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        const audio = document.getElementById('audio');
        const playBtn = document.getElementById('playBtn');
        const vinyl = document.getElementById('vinyl');
        const canvas = document.getElementById('visualizer');
        const ctx = canvas.getContext('2d');

        playBtn.addEventListener('click', () => {
            if(audio.paused) {
                audio.play();
                playBtn.innerHTML = '<i class="fas fa-pause"></i>';
                vinyl.classList.add('playing');
                startVisualizer();
            } else {
                audio.pause();
                playBtn.innerHTML = '<i class="fas fa-play"></i>';
                vinyl.classList.remove('playing');
            }
        });

        function startVisualizer() {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const src = audioCtx.createMediaElementSource(audio);
            const analyser = audioCtx.createAnalyser();
            src.connect(analyser);
            analyser.connect(audioCtx.destination);
            analyser.fftSize = 64;
            const bufferLength = analyser.frequencyBinCount;
            const dataArray = new Uint8Array(bufferLength);

            function draw() {
                requestAnimationFrame(draw);
                analyser.getByteFrequencyData(dataArray);
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                const barWidth = (canvas.width / bufferLength) * 2.5;
                let x = 0;
                dataArray.forEach(val => {
                    const barHeight = val / 2;
                    ctx.fillStyle = `rgb(102, 126, 234)`;
                    ctx.fillRect(x, canvas.height - barHeight, barWidth, barHeight);
                    x += barWidth + 1;
                });
            }
            draw();
        }
    </script>
</body>
</html>
