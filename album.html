<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Album Kelas</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 15px;
            padding: 120px 5% 50px;
        }
        .gallery-item {
            position: relative;
            height: 250px;
            overflow: hidden;
            border-radius: 15px;
            cursor: pointer;
        }
        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: 0.5s;
        }
        .overlay {
            position: absolute;
            bottom: -100%;
            left: 0;
            width: 100%;
            padding: 20px;
            background: linear-gradient(transparent, rgba(0,0,0,0.8));
            color: white;
            transition: 0.4s;
        }
        .gallery-item:hover img { transform: scale(1.1); filter: brightness(0.7); }
        .gallery-item:hover .overlay { bottom: 0; }

        /* Lightbox */
        #lightbox {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }
        #lightbox img { max-width: 90%; max-height: 80%; border: 5px solid white; }
    </style>
</head>
<body>
    <nav>
        <a href="index.html" style="text-decoration: none;"><div class="logo">BACK</div></a>
        <div class="theme-switch" id="theme-icon" onclick="toggleTheme()"><i class="fas fa-moon"></i></div>
    </nav>

    <div class="gallery" id="galleryGrid">
        <!-- Student photos will be populated here by script.js -->
    </div>

    <div id="lightbox" onclick="this.style.display='none'">
        <img id="lightbox-img" src="">
    </div>

    <script src="script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            initTheme(); // Initialize theme for this page
            renderGallery(); // Render generic photos for the album page
        });
    </script>
</body>
</html>
