<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Favorit Song</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .player-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            padding-top: 80px;
        }
        .vinyl {
            width: 200px; height: 200px;
            border-radius: 50%;
            background: #333 url('https://upload.wikimedia.org/wikipedia/commons/b/b6/Vinyl_record_LP.png') center/cover;
            border-radius: 50%;
            margin-bottom: 30px;
            box-shadow: 0 0 50px rgba(0,0,0,0.5);
        }
        .vinyl.playing { animation: rotate 5s linear infinite; }
        @keyframes rotate { from {transform: rotate(0deg);} to {transform: rotate(360deg);} }
        
        #visualizer { width: 100%; height: 100px; margin-top: 20px; }
        .controls { display: flex; gap: 20px; align-items: center; margin-top: 20px; }
    </style>
</head>
<body>
    <nav>
        <a href="index.html" style="text-decoration: none;"><div class="logo">BACK</div></a>
        <div class="theme-switch" id="theme-icon" onclick="toggleTheme()"><i class="fas fa-moon"></i></div>
    </nav>

    <div class="player-container">
        <div class="vinyl glass-card" id="vinyl"></div>
        <div class="glass-card" style="padding: 30px; text-align: center; width: 90%; max-width: 500px;">
            <h3>Yang Patah Tumbuh...</h3>
            <p>Banda Neira</p>
            <h3>Sampai Jadi Debu</h3>
            <p>Banda Neira (feat. Gardika Gigih)</p>
            <h3>Dari Jendela Kelas</h3>
            <p>Iwan Fals</p>
            
            <canvas id="visualizer"></canvas>
            
            <audio id="mainAudio" src="https://mp3tourl.com/audio/1777300508407-9b196423-0e37-4908-bc3a-d221315ad050.mp3"></audio>
            
            <div class="controls">
                <i class="fas fa-step-backward fa-2x" onclick="changeSong(-1)"></i>
                <button class="btn-neon" onclick="togglePlay()"><i class="fas fa-play" id="playIcon"></i></button>
                <i class="fas fa-step-forward fa-2x" onclick="changeSong(1)"></i>
            </div>
            <input type="range" id="progressBar" min="0" max="100" value="0" style="width:100%; margin-top:20px">
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
