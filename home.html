<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Home - Class Website</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .hero {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
            padding: 0 20px;
        }
        .big-icon {
            font-size: 6rem;
            color: var(--primary);
            animation: bounce 2s infinite;
            margin-bottom: 20px;
            filter: drop-shadow(var(--neon));
        }
        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {transform: translateY(0);}
            40% {transform: translateY(-30px);}
            60% {transform: translateY(-15px);}
        }
        .typing {
            font-size: 2rem;
            font-weight: bold;
            border-right: 3px solid var(--primary);
            white-space: nowrap;
            overflow: hidden;
            width: 0;
            animation: typing 3.5s steps(40, end) forwards, blink .75s step-end infinite;
        }
        @keyframes typing { from { width: 0 } to { width: 100% } }
        @keyframes blink { from, to { border-color: transparent } 50% { border-color: var(--primary); } }
        .info-grid {
            display: flex;
            gap: 20px;
            margin-top: 50px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .info-item { padding: 20px; min-width: 200px; }
    </style>
</head>
<body>
    <nav>
        <a href="index.html" style="text-decoration: none;"><div class="logo"><i class="fas fa-arrow-left"></i> KEMBALI</div></a>
        <div class="theme-switch" id="theme-toggle"><i class="fas fa-moon"></i></div>
    </nav>

    <div class="hero">
        <i class="fas fa-home big-icon"></i>
        <div class="typing">Selamat Datang di Website Kelas Kami!</div>
        
        <div class="info-grid">
            <div class="glass-card info-item reveal">
                <h4>Nama Kelas</h4>
                <p>XII MIPA 1</p>
            </div>
            <div class="glass-card info-item reveal">
                <h4>Wali Kelas</h4>
                <p>Bpk. Software Eng.</p>
            </div>
            <div class="glass-card info-item reveal">
                <h4>Moto</h4>
                <p><i>"Coding with Heart, Dreaming Big."</i></p>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
