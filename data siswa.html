<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Data Siswa</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .container { padding: 120px 5% 50px; }
        .search-container { margin-bottom: 30px; text-align: center; }
        .search-bar {
            padding: 15px 25px;
            width: 100%;
            max-width: 500px;
            border-radius: 50px;
            border: none;
            background: var(--card-bg);
            color: var(--text-color);
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .student-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }
        .student-card { padding: 20px; text-align: center; }
        .student-card h3 { color: var(--primary); margin-bottom: 10px; }
    </style>
</head>
<body>
    <nav>
        <a href="index.html" style="text-decoration: none;"><div class="logo">BACK</div></a>
        <div class="theme-switch" id="theme-icon" onclick="toggleTheme()"><i class="fas fa-moon"></i></div>
    </nav>

    <div class="container">
        <div class="search-container reveal">
            <input type="text" id="studentSearch" class="search-bar" placeholder="Cari nama temanmu..." onkeyup="filterStudents()">
        </div>
        <div class="student-grid" id="studentList">
            <!-- JS will populate -->
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
