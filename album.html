<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Album Kelas</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 15px;
            padding: 120px 5% 50px;
        }
        .photo-item {
            position: relative;
            height: 250px;
            overflow: hidden;
            border-radius: 15px;
            cursor: pointer;
        }
        .photo-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: 0.5s;
        }
        .photo-item:hover img { transform: scale(1.1); filter: brightness(0.7); }
        .overlay {
            position: absolute;
            bottom: -100%;
            left: 0;
            width: 100%;
            padding: 20px;
            background: linear-gradient(transparent, rgba(0,0,0,0.8));
            color: white;
            transition: 0.4s;
        }
        .photo-item:hover .overlay { bottom: 0; }

        /* Lightbox */
        #lightbox {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }
        #lightbox img { max-width: 90%; max-height: 80%; border: 5px solid white; }
    </style>
</head>
<body>
    <nav>
        <a href="index.html" style="text-decoration: none;"><div class="logo">BACK</div></a>
        <div class="theme-switch" id="theme-toggle"><i class="fas fa-moon"></i></div>
    </nav>

    <div class="gallery" id="gallery">
        <!-- Placeholder Images -->
        <div class="photo-item glass-card reveal" onclick="openLightbox('https://picsum.photos/800/600?random=1')">
            <img src="https://picsum.photos/400/300?random=1" alt="Foto">
            <div class="overlay"><h4>Kunjungan Museum</h4><p>12 Jan 2024</p></div>
        </div>
        <div class="photo-item glass-card reveal" onclick="openLightbox('https://picsum.photos/800/600?random=2')">
            <img src="https://picsum.photos/400/300?random=2" alt="Foto">
            <div class="overlay"><h4>Lomba Classmeeting</h4><p>15 Feb 2024</p></div>
        </div>
        <div class="photo-item glass-card reveal" onclick="openLightbox('https://picsum.photos/800/600?random=3')">
            <img src="https://picsum.photos/400/300?random=3" alt="Foto">
            <div class="overlay"><h4>Ulang Tahun Kelas</h4><p>20 Mar 2024</p></div>
        </div>
    </div>

    <div id="lightbox" onclick="this.style.display='none'">
        <img id="lightbox-img" src="">
    </div>

    <script src="script.js"></script>
    <script>
        function openLightbox(src) {
            document.getElementById('lightbox-img').src = src;
            document.getElementById('lightbox').style.display = 'flex';
        }
    </script>
</body>
</html>
